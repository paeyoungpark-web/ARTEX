id: U-10
standard: jutonggi
category: 파일및디렉터리관리
title: /etc/(x)inetd.conf 파일 소유자 및 권한 설정
description: (x)inetd.conf 파일의 소유자가 root이고 권한이 600 이하인지 점검
risk_level: high
target_types: [server_unix]
check_method: script
script_ref: scripts/unix/U-10.sh
pass_criteria: inetd.conf/xinetd.conf 파일 소유자 root, 권한 600 이하
fail_criteria: 소유자가 root가 아니거나 권한이 600 초과 (해당 파일 미존재 시 양호)
remediation: |
  chown root /etc/inetd.conf (또는 xinetd.conf)
  chmod 600 /etc/inetd.conf
ismsp_mapping: ["2.5.1"]
rule_ref: rules/unix/U-10.rule.yaml
