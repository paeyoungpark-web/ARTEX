id: U-07
standard: jutonggi
category: 파일및디렉터리관리
title: /etc/passwd 파일 소유자 및 권한 설정
description: /etc/passwd 파일의 소유자가 root이고 권한이 644 이하인지 점검
risk_level: high
target_types: [server_unix]
check_method: script
script_ref: scripts/unix/U-07.sh
pass_criteria: /etc/passwd 파일 소유자 root, 권한 644 이하
fail_criteria: 소유자가 root가 아니거나 권한이 644 초과
remediation: |
  chown root /etc/passwd
  chmod 644 /etc/passwd
ismsp_mapping: ["2.5.1", "2.5.2"]
rule_ref: rules/unix/U-07.rule.yaml
